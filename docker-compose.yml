services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - sqlite-data:/app/data
      - ./uploads:/app/uploads
    networks:
      - default
      - llama_default
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_CALLBACK_URL: http://localhost/auth/callback
        NEXT_PUBLIC_SKIP_AUTH: "true"
        NEXT_PUBLIC_AUTH_PROVIDER: google
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_CALLBACK_URL: http://localhost/auth/callback
      NEXT_PUBLIC_SKIP_AUTH: "true"
      NEXT_PUBLIC_AUTH_PROVIDER: google
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  sqlite-data:
  uploads:

networks:
  llama_default:
    external: true
