services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://siekxlkhsppcqwyoxrvn.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_6FCyJEvBLByH-C_DBKHkdQ_QunNQuS4
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_CALLBACK_URL: http://localhost/auth/callback
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://siekxlkhsppcqwyoxrvn.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_6FCyJEvBLByH-C_DBKHkdQ_QunNQuS4
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CALLBACK_URL: http://localhost/auth/callback
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
