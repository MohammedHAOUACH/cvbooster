services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Allow the container to reach services on the host (e.g. LOCAL_LLM_URL=http://host.docker.internal:1234)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sqlite-data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are baked in at build time: keep them in sync with .env
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SKIP_AUTH: ${SKIP_AUTH:-false}
        NEXT_PUBLIC_AUTH_PROVIDER: google
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_SKIP_AUTH: ${SKIP_AUTH:-false}
      NEXT_PUBLIC_AUTH_PROVIDER: google
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  sqlite-data:
